[project]
name = "close-future-agent"
version = "0.1.0"
description = "Multi-agent lead chatbot backend for CloseFuture (LangGraph + FastAPI + Supabase pgvector)"
requires-python = ">=3.11"
dependencies = [
  # Pinned to the verified working set (Phase 8). Check LangGraph/LangChain docs
  # before bumping — their APIs move quickly (CLAUDE.md §3).
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "langgraph==1.2.11",
  "langchain-core==1.6.3",
  "langchain-openai==0.3.28",
  "psycopg[binary,pool]==3.2.3",
  "pyyaml==6.0.1",
  "httpx==0.27.2",
  "pymupdf==1.24.0",
  "google-api-python-client==2.160.0",
  "google-auth==2.38.0",
  "google-auth-httplib2==0.2.0",
  "google-auth-oauthlib==1.2.1",
  "mcp==1.30.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "ruff==0.9.4",
  "mypy==1.14.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools"]
